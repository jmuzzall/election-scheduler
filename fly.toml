app = 'election-scheduler'
primary_region = 'iad'

[build]

# Persistent volume — keeps your SQLite database across deploys/restarts
[mounts]
  source = 'election_data'
  destination = '/app/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
